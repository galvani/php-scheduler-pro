name: php-scheduler-pro

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    build: .
    image: php-scheduler-pro
    user: &user "${UID:-1000}:${GID:-1000}"
    command: ["sh", "-c", "composer install --no-interaction --no-scripts && composer test"]
    volumes:
      - .:/app
      - vendor:/app/vendor
    environment: &runtime
      HOME: /tmp
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy

  demo-laravel:
    build: .
    image: php-scheduler-pro
    user: *user
    command: ["sh", "-c", "composer install --working-dir=demo/laravel --no-interaction && demo/laravel/prove.sh"]
    volumes:
      - .:/app
      - demo-laravel-vendor:/app/demo/laravel/vendor
    environment:
      <<: *runtime
      APP_KEY: base64:c2NoZWR1bGVyLWRlbW8ta2V5LW5vdC1hLXNlY3JldCE=
      CACHE_STORE: file
      SCHEDULING_HOST: demo
    depends_on:
      redis:
        condition: service_healthy

  demo:
    build: .
    image: php-scheduler-pro
    user: *user
    command: ["sh", "-c", "composer install --working-dir=demo/symfony --no-interaction --no-scripts && demo/symfony/prove.sh"]
    volumes:
      - .:/app
      - demo-vendor:/app/demo/symfony/vendor
      - demo-var:/app/demo/symfony/var
    environment:
      <<: *runtime
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  install-laravel:
    build: .
    image: php-scheduler-pro
    user: *user
    command: ["docker/install-test.sh", "laravel"]
    volumes:
      - .:/app:ro
    environment:
      <<: *runtime
    depends_on:
      redis:
        condition: service_healthy

  install-laravel-12:
    build: .
    image: php-scheduler-pro
    user: *user
    command: ["docker/install-test.sh", "laravel", "^12.0"]
    volumes:
      - .:/app:ro
    environment:
      <<: *runtime
    depends_on:
      redis:
        condition: service_healthy

  install-symfony:
    build: .
    image: php-scheduler-pro
    user: *user
    command: ["docker/install-test.sh", "symfony"]
    volumes:
      - .:/app:ro
    environment:
      <<: *runtime
    depends_on:
      redis:
        condition: service_healthy

volumes:
  vendor:
  demo-laravel-vendor:
  demo-vendor:
  demo-var:
